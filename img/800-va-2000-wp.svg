<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="cmpTitle cmpDesc" xml:lang="de">
  <title id="cmpTitle">2000 Wp und 800 VA</title>
  <desc id="cmpDesc">2000 Wp ist die Summe der Module: Gleichstrom, Laborwert. 800 VA ist der Wechselrichter: Wechselstrom ins Haus (EEG § 8 Abs. 5a). Mehr Modul-Wp als Wechselrichter-VA ist zulässig. Der Wechselrichter begrenzt, was in der Steckdose ankommt.</desc>

  <rect width="1200" height="680" fill="#06110c"/>

  <!-- kicker -->
  <rect x="40" y="34" width="8" height="8" rx="2" fill="#d7ff5e"/>
  <text x="58" y="43" fill="#d7ff5e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">EEG § 8 Abs. 5a</text>
  <line x1="248" y1="38" x2="1160" y2="38" stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="1"/>

  <!-- card A: 2000 Wp, wider -->
  <rect x="40" y="72" width="692" height="456" rx="24" fill="#0b1c14" stroke="#d7ff5e" stroke-width="2"/>

  <g aria-hidden="true">
    <rect x="76" y="108" width="70" height="56" rx="8" fill="#101714" stroke="#d7ff5e" stroke-width="1.5"/>
    <g stroke="#d7ff5e" stroke-opacity="0.38" stroke-width="1.2">
      <line x1="99" y1="114" x2="99" y2="158"/>
      <line x1="123" y1="114" x2="123" y2="158"/>
      <line x1="82" y1="127" x2="140" y2="127"/>
      <line x1="82" y1="145" x2="140" y2="145"/>
    </g>
    <rect x="158" y="108" width="70" height="56" rx="8" fill="#101714" stroke="#d7ff5e" stroke-width="1.5"/>
    <g stroke="#d7ff5e" stroke-opacity="0.38" stroke-width="1.2">
      <line x1="181" y1="114" x2="181" y2="158"/>
      <line x1="205" y1="114" x2="205" y2="158"/>
      <line x1="164" y1="127" x2="222" y2="127"/>
      <line x1="164" y1="145" x2="222" y2="145"/>
    </g>
  </g>

  <text x="76" y="216" fill="#9fb8a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Summe der Module</text>
  <text x="76" y="308" fill="#f4f6f2" font-family="Georgia, ui-serif, serif" font-size="76" font-weight="700">2000 Wp</text>
  <text x="76" y="356" fill="#9fb8a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">Gleichstrom, Laborwert</text>

  <rect x="76" y="420" width="616" height="10" rx="5" fill="#101714"/>
  <rect x="76" y="420" width="616" height="10" rx="5" fill="#d7ff5e"/>

  <!-- card B: 800 VA, narrower, output cap -->
  <rect x="756" y="116" width="404" height="412" rx="24" fill="#101714" stroke="#d7ff5e" stroke-width="2"/>

  <g aria-hidden="true">
    <rect x="788" y="144" width="88" height="64" rx="10" fill="#0b1c14" stroke="#d7ff5e" stroke-width="1.5"/>
    <path d="M802 176h10l8-16 12 32 12-32 8 16h10" fill="none" stroke="#d7ff5e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="900" y="152" width="48" height="48" rx="12" fill="#f4f6f2"/>
    <circle cx="918" cy="176" r="4" fill="#101714"/>
    <circle cx="930" cy="176" r="4" fill="#101714"/>
  </g>

  <text x="788" y="252" fill="#9fb8a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Wechselrichter</text>
  <rect x="788" y="268" width="248" height="4" rx="2" fill="#d7ff5e"/>
  <text x="788" y="338" fill="#d7ff5e" font-family="Georgia, ui-serif, serif" font-size="62" font-weight="700">800 VA</text>
  <text x="788" y="384" fill="#f4f6f2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Wechselstrom ins Haus</text>

  <rect x="788" y="428" width="340" height="10" rx="5" fill="#0b1c14"/>
  <rect x="788" y="428" width="246" height="10" rx="5" fill="#d7ff5e"/>
  <line x1="1034" y1="420" x2="1034" y2="446" stroke="#d7ff5e" stroke-width="3" stroke-linecap="round"/>

  <!-- footer -->
  <line x1="40" y1="552" x2="1160" y2="552" stroke="#d7ff5e" stroke-opacity="0.22" stroke-width="1"/>
  <text x="40" y="588" fill="#f4f6f2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23">Mehr Modul-Wp als Wechselrichter-VA ist zulässig.</text>
  <text x="40" y="624" fill="#9fb8a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23">Der Wechselrichter begrenzt, was in der Steckdose ankommt.</text>
</svg>
