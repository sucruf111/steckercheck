<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="plugTitle plugDesc">
  <title id="plugTitle">Schuko und Energiesteckvorrichtung</title>
  <desc id="plugDesc">Links ein Schuko-Stecker für Modulleistung bis 960 Watt, rechts eine Energiesteckvorrichtung für größere Modulsummen.</desc>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e15"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#pbg)"/>
  <line x1="600" y1="48" x2="600" y2="380" stroke="#d7ff5e" stroke-opacity="0.14" stroke-width="2"/>

  <g>
    <circle cx="300" cy="210" r="148" fill="#f4f6f2"/>
    <circle cx="300" cy="210" r="114" fill="#dbe3da"/>
    <circle cx="255" cy="210" r="15" fill="#101714"/>
    <circle cx="345" cy="210" r="15" fill="#101714"/>
    <rect x="284" y="98" width="32" height="22" rx="6" fill="#8fa396"/>
    <rect x="284" y="300" width="32" height="22" rx="6" fill="#8fa396"/>
    <text x="300" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="650" fill="#f4f6f2">Schuko</text>
    <text x="300" y="454" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#9fb8a8">bis 960 W Module</text>
  </g>

  <g>
    <circle cx="900" cy="210" r="148" fill="#f4f6f2"/>
    <circle cx="900" cy="210" r="114" fill="#dbe3da"/>
    <path d="M900 96 l22 28 h-44 z" fill="#8fa396"/>
    <circle cx="900" cy="164" r="13" fill="#101714"/>
    <circle cx="856" cy="238" r="13" fill="#101714"/>
    <circle cx="944" cy="238" r="13" fill="#101714"/>
    <circle cx="900" cy="210" r="144" fill="none" stroke="#d7ff5e" stroke-opacity="0.5" stroke-width="5" stroke-dasharray="10 14"/>
    <text x="900" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="650" fill="#f4f6f2">Energiestecker</text>
    <text x="900" y="454" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#9fb8a8">über 960 W Module</text>
  </g>
</svg>
