<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="flussTitle flussDesc">
  <title id="flussTitle">Vom Modul in die Steckdose</title>
  <desc id="flussDesc">Module liefern Gleichstrom in Wp. Der Wechselrichter macht Wechselstrom und begrenzt auf 800 VA. Die Steckdose nimmt den Strom ins Hausnetz.</desc>
  <rect width="960" height="280" rx="28" fill="#06110c"/>
  <g fill="none" stroke="#d7ff5e" stroke-width="2">
    <rect x="48" y="70" width="200" height="120" rx="16"/>
    <rect x="380" y="58" width="200" height="144" rx="16"/>
    <rect x="712" y="70" width="200" height="120" rx="16"/>
    <path d="M248 130h132" stroke-linecap="round"/>
    <path d="M580 130h132" stroke-linecap="round"/>
    <path d="M368 130l12-8m-12 8l12 8" />
    <path d="M700 130l12-8m-12 8l12 8" />
  </g>
  <text x="148" y="108" text-anchor="middle" fill="#d7ff5e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Module</text>
  <text x="148" y="132" text-anchor="middle" fill="#eef4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">bis 2000 Wp</text>
  <text x="148" y="158" text-anchor="middle" fill="rgba(238,244,238,.7)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Gleichstrom · Laborwert</text>
  <text x="480" y="108" text-anchor="middle" fill="#d7ff5e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Wechselrichter</text>
  <text x="480" y="132" text-anchor="middle" fill="#eef4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">max. 800 VA</text>
  <text x="480" y="158" text-anchor="middle" fill="rgba(238,244,238,.7)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Wechselstrom ins Haus</text>
  <text x="812" y="108" text-anchor="middle" fill="#d7ff5e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Steckdose</text>
  <text x="812" y="132" text-anchor="middle" fill="#eef4ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Hausnetz</text>
  <text x="812" y="158" text-anchor="middle" fill="rgba(238,244,238,.7)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">nicht 2000 W in der Dose</text>
</svg>
