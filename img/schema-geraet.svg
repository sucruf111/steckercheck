<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="schemaTitle schemaDesc">
  <title id="schemaTitle">Module, Wechselrichter, Steckdose</title>
  <desc id="schemaDesc">Zwei Solarmodule liefern Gleichstrom an den Wechselrichter, der höchstens 800 Voltampere ins Hausnetz abgibt.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e15"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
    <linearGradient id="spanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14382a"/>
      <stop offset="1" stop-color="#0d271c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d7ff5e"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#sbg)"/>

  <g>
    <rect x="64" y="88" width="148" height="268" rx="14" fill="url(#spanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="138" y1="96" x2="138" y2="348"/>
      <line x1="72" y1="178" x2="204" y2="178"/>
      <line x1="72" y1="266" x2="204" y2="266"/>
    </g>
    <rect x="232" y="88" width="148" height="268" rx="14" fill="url(#spanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="306" y1="96" x2="306" y2="348"/>
      <line x1="240" y1="178" x2="372" y2="178"/>
      <line x1="240" y1="266" x2="372" y2="266"/>
    </g>
    <text x="64" y="420" font-family="system-ui, sans-serif" font-size="42" font-weight="650" fill="#f4f6f2">Module</text>
    <text x="64" y="466" font-family="system-ui, sans-serif" font-size="30" fill="#9fb8a8">Summe bis 2000 Wp</text>
    <text x="64" y="504" font-family="system-ui, sans-serif" font-size="30" fill="#9fb8a8">Gleichstrom</text>
  </g>

  <line x1="416" y1="222" x2="548" y2="222" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="430" y="196" font-family="system-ui, sans-serif" font-size="28" fill="#9fb8a8">DC</text>

  <g>
    <rect x="580" y="140" width="236" height="164" rx="20" fill="#0e2117" stroke="#d7ff5e" stroke-opacity="0.6" stroke-width="4"/>
    <circle cx="620" cy="182" r="9" fill="#d7ff5e"/>
    <path d="M640 250 q22 -36 44 0 q22 36 44 0" fill="none" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round"/>
    <text x="580" y="420" font-family="system-ui, sans-serif" font-size="42" font-weight="650" fill="#f4f6f2">Wechselrichter</text>
    <text x="580" y="466" font-family="system-ui, sans-serif" font-size="30" fill="#9fb8a8">Ausgang höchstens 800 VA</text>
    <text x="580" y="504" font-family="system-ui, sans-serif" font-size="30" fill="#9fb8a8">Wechselstrom</text>
  </g>

  <line x1="852" y1="222" x2="984" y2="222" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="868" y="196" font-family="system-ui, sans-serif" font-size="28" fill="#9fb8a8">AC</text>

  <g>
    <rect x="1012" y="164" width="124" height="124" rx="26" fill="#f4f6f2"/>
    <circle cx="1074" cy="226" r="40" fill="#dbe3da"/>
    <circle cx="1058" cy="226" r="7" fill="#101714"/>
    <circle cx="1090" cy="226" r="7" fill="#101714"/>
    <text x="970" y="420" font-family="system-ui, sans-serif" font-size="42" font-weight="650" fill="#f4f6f2">Steckdose</text>
    <text x="1008" y="466" font-family="system-ui, sans-serif" font-size="30" fill="#9fb8a8">Hausnetz</text>
  </g>
</svg>
