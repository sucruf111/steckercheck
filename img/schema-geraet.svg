<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="schemaTitle schemaDesc">
  <title id="schemaTitle">Module, Wechselrichter, Steckdose</title>
  <desc id="schemaDesc">Zwei Solarmodule liefern Gleichstrom an den Wechselrichter, der höchstens 800 Voltampere ins Hausnetz abgibt.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e15"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
    <linearGradient id="spanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14382a"/>
      <stop offset="1" stop-color="#0d271c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d7ff5e"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#sbg)"/>

  <!-- modules -->
  <g>
    <rect x="80" y="180" width="150" height="330" rx="14" fill="url(#spanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="155" y1="188" x2="155" y2="502"/>
      <line x1="88" y1="290" x2="222" y2="290"/>
      <line x1="88" y1="400" x2="222" y2="400"/>
    </g>
    <rect x="255" y="180" width="150" height="330" rx="14" fill="url(#spanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="330" y1="188" x2="330" y2="502"/>
      <line x1="263" y1="290" x2="397" y2="290"/>
      <line x1="263" y1="400" x2="397" y2="400"/>
    </g>
    <text x="80" y="580" font-family="system-ui, sans-serif" font-size="34" font-weight="650" fill="#f4f6f2">Module</text>
    <text x="80" y="622" font-family="system-ui, sans-serif" font-size="26" fill="#9fb8a8">Summe bis 2000 Wp</text>
    <text x="80" y="656" font-family="system-ui, sans-serif" font-size="26" fill="#9fb8a8">Gleichstrom</text>
  </g>

  <!-- DC arrow -->
  <line x1="440" y1="345" x2="560" y2="345" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="452" y="322" font-family="system-ui, sans-serif" font-size="24" fill="#9fb8a8">DC</text>

  <!-- inverter -->
  <g>
    <rect x="600" y="255" width="240" height="180" rx="20" fill="#0e2117" stroke="#d7ff5e" stroke-opacity="0.6" stroke-width="4"/>
    <circle cx="640" cy="300" r="9" fill="#d7ff5e"/>
    <path d="M660 372 q22 -36 44 0 q22 36 44 0" fill="none" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round"/>
    <text x="600" y="580" font-family="system-ui, sans-serif" font-size="34" font-weight="650" fill="#f4f6f2">Wechselrichter</text>
    <text x="600" y="622" font-family="system-ui, sans-serif" font-size="26" fill="#9fb8a8">Ausgang höchstens 800 VA</text>
    <text x="600" y="656" font-family="system-ui, sans-serif" font-size="26" fill="#9fb8a8">Wechselstrom</text>
  </g>

  <!-- AC arrow -->
  <line x1="875" y1="345" x2="995" y2="345" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="887" y="322" font-family="system-ui, sans-serif" font-size="24" fill="#9fb8a8">AC</text>

  <!-- socket -->
  <g>
    <rect x="1020" y="285" width="120" height="120" rx="26" fill="#f4f6f2"/>
    <circle cx="1080" cy="345" r="40" fill="#dbe3da"/>
    <circle cx="1064" cy="345" r="7" fill="#101714"/>
    <circle cx="1096" cy="345" r="7" fill="#101714"/>
    <text x="1018" y="580" font-family="system-ui, sans-serif" font-size="34" font-weight="650" fill="#f4f6f2">Steckdose</text>
    <text x="1018" y="622" font-family="system-ui, sans-serif" font-size="26" fill="#9fb8a8">Hausnetz</text>
  </g>

  <!-- footnote -->
  <text x="80" y="740" font-family="system-ui, sans-serif" font-size="24" fill="#6f8a7c">EEG § 8 Abs. 5a: beide Grenzen gelten gleichzeitig.</text>
</svg>
