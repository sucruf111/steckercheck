<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Balkon mit Steckersolargerät</title>
  <desc id="heroDesc">Zwei Solarmodule am Balkongeländer, darunter ein Wechselrichter, dessen Kabel zu einer Steckdose an der Hauswand führt.</desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2016"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7ff5e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d7ff5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14382a"/>
      <stop offset="1" stop-color="#0d271c"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="933" fill="url(#hbg)"/>

  <!-- sun -->
  <circle cx="1130" cy="170" r="230" fill="url(#hglow)"/>
  <circle cx="1130" cy="170" r="78" fill="#d7ff5e"/>
  <g stroke="#d7ff5e" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="1130" y1="40" x2="1130" y2="66"/>
    <line x1="1130" y1="274" x2="1130" y2="300"/>
    <line x1="1000" y1="170" x2="1026" y2="170"/>
    <line x1="1234" y1="170" x2="1260" y2="170"/>
    <line x1="1038" y1="78" x2="1057" y2="97"/>
    <line x1="1203" y1="243" x2="1222" y2="262"/>
    <line x1="1222" y1="78" x2="1203" y2="97"/>
    <line x1="1057" y1="243" x2="1038" y2="262"/>
  </g>

  <!-- faint facade lines -->
  <g stroke="#d7ff5e" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="120" x2="760" y2="120"/>
    <line x1="0" y1="250" x2="700" y2="250"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="420" y1="0" x2="420" y2="380"/>
  </g>

  <!-- balcony slab -->
  <rect x="60" y="700" width="1280" height="26" rx="13" fill="#123326"/>
  <rect x="60" y="726" width="1280" height="90" fill="#0b1c14"/>

  <!-- railing -->
  <g stroke="#2c5c44" stroke-width="10" stroke-linecap="round">
    <line x1="120" y1="480" x2="120" y2="700"/>
    <line x1="240" y1="480" x2="240" y2="700"/>
    <line x1="360" y1="480" x2="360" y2="700"/>
    <line x1="480" y1="480" x2="480" y2="700"/>
    <line x1="600" y1="480" x2="600" y2="700"/>
    <line x1="720" y1="480" x2="720" y2="700"/>
    <line x1="840" y1="480" x2="840" y2="700"/>
    <line x1="960" y1="480" x2="960" y2="700"/>
    <line x1="1080" y1="480" x2="1080" y2="700"/>
    <line x1="1200" y1="480" x2="1200" y2="700"/>
    <line x1="1320" y1="480" x2="1320" y2="700"/>
  </g>
  <rect x="80" y="455" width="1280" height="22" rx="11" fill="#3a7a5a"/>

  <!-- module 1 -->
  <g transform="translate(150 420) rotate(-10)">
    <rect x="0" y="0" width="360" height="230" rx="14" fill="url(#hpanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="120" y1="8" x2="120" y2="222"/>
      <line x1="240" y1="8" x2="240" y2="222"/>
      <line x1="10" y1="78" x2="350" y2="78"/>
      <line x1="10" y1="154" x2="350" y2="154"/>
    </g>
  </g>

  <!-- module 2 -->
  <g transform="translate(560 428) rotate(-10)">
    <rect x="0" y="0" width="360" height="230" rx="14" fill="url(#hpanel)" stroke="#d7ff5e" stroke-opacity="0.55" stroke-width="4"/>
    <g stroke="#d7ff5e" stroke-opacity="0.28" stroke-width="3">
      <line x1="120" y1="8" x2="120" y2="222"/>
      <line x1="240" y1="8" x2="240" y2="222"/>
      <line x1="10" y1="78" x2="350" y2="78"/>
      <line x1="10" y1="154" x2="350" y2="154"/>
    </g>
  </g>

  <!-- inverter -->
  <g>
    <rect x="985" y="565" width="150" height="92" rx="16" fill="#0e2117" stroke="#d7ff5e" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="1015" cy="596" r="8" fill="#d7ff5e"/>
    <path d="M1042 620 q14 -22 28 0 q14 22 28 0" fill="none" stroke="#d7ff5e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- cable -->
  <path d="M1135 610 C 1210 610 1215 540 1268 522" fill="none" stroke="#d7ff5e" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- wall socket -->
  <g>
    <rect x="1250" y="450" width="104" height="104" rx="22" fill="#f4f6f2"/>
    <circle cx="1302" cy="502" r="34" fill="#dbe3da"/>
    <circle cx="1288" cy="502" r="6" fill="#101714"/>
    <circle cx="1316" cy="502" r="6" fill="#101714"/>
  </g>

</svg>
